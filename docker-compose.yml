version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      # Ruta de la base de datos dentro del volumen persistente
      - DB_PATH=/app/data/recipes.db
    volumes:
      # Persistencia de la base de datos SQLite
      - db_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000

volumes:
  db_data: